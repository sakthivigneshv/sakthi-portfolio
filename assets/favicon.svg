<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="svGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#2cb67d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2cb67d" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#2cb67d" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#0e0e14" stroke="url(#borderGrad)" stroke-width="4"/>
  <!-- <SV> Logo Text -->
  <g font-family="'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34">
    <!-- Opening Bracket -->
    <text x="18" y="62" fill="#2cb67d" filter="url(#bracketGlow)" text-anchor="middle">&lt;</text>
    <!-- SV Text -->
    <text x="50" y="62" fill="url(#svGradient)" text-anchor="middle" letter-spacing="1">SV</text>
    <!-- Closing Bracket -->
    <text x="82" y="62" fill="#2cb67d" filter="url(#bracketGlow)" text-anchor="middle">&gt;</text>
  </g>
</svg>
